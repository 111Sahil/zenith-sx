name: Build Android APK & Auto-Update

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk-and-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 for Capacitor 6 Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Bundle & Live Auto-Update Config
        run: |
          mkdir -p www
          cp -r index.html styles.css manifest.json sw.js data js www/
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.server = { url: "https://111sahil.github.io/zenith-sx/", cleartext: false };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

      - name: Install Capacitor & Build Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Zenith_SX_AutoUpdate.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zenith_SX_AutoUpdate_APK
          path: Zenith_SX_AutoUpdate.apk

      - name: Publish APK directly to Repo Releases Page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          gh release create latest Zenith_SX_AutoUpdate.apk --title "Zenith SX Auto-Update APK" --notes "Tap Zenith_SX_AutoUpdate.apk below on your Android phone to install. All future repo edits update the app automatically."

      - name: Upload Live Bundle to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

  deploy-pages:
    needs: build-apk-and-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ [invalid URL]_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
